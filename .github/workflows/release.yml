name: Release JUAN-VIVI

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Actualizar versión desde tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.version = $version
          $conf | ConvertTo-Json -Depth 20 | Set-Content src-tauri/tauri.conf.json -Encoding UTF8

      - name: Instalar Tesseract OCR
        run: choco install tesseract --yes --no-progress
        shell: cmd

      - name: Copiar Tesseract a resources
        shell: pwsh
        run: |
          $src = "C:\Program Files\Tesseract-OCR"
          $dst = "src-tauri/resources/tesseract"
          New-Item -ItemType Directory -Force -Path "$dst/tessdata" | Out-Null
          Copy-Item "$src/tesseract.exe" "$dst/"
          Copy-Item "$src/*.dll" "$dst/"
          Copy-Item "$src/tessdata/eng.traineddata" "$dst/tessdata/"

      - name: Descargar pdfium.dll
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/resources" | Out-Null
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/bblanchon/pdfium-binaries/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -eq "pdfium-win-x64.tgz" }
          $url = $asset.browser_download_url
          Invoke-WebRequest -Uri $url -OutFile "pdfium.tgz"
          tar -xf pdfium.tgz
          Copy-Item "bin/pdfium.dll" "src-tauri/resources/pdfium.dll"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build y publicar release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'JUAN-VIVI ${{ github.ref_name }}'
          releaseBody: |
            ## JUAN-VIVI ${{ github.ref_name }}
            Instalador de Windows. Las instalaciones existentes se actualizarán automáticamente.
          releaseDraft: false
          prerelease: false

