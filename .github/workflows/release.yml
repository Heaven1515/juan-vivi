name: Release JUAN-VIVI

# Se activa cuando haces: git tag v1.0.1 && git push origin v1.0.1
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write   # necesario para crear el release en GitHub

    steps:
      # 1 — Descargar el código
      - name: Checkout
        uses: actions/checkout@v4

      # 2 — Actualizar versión en tauri.conf.json con el número del tag
      #     Ej: tag v1.0.1 → version "1.0.1" en el instalador
      - name: Actualizar versión desde tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.version = $version
          $conf | ConvertTo-Json -Depth 20 | Set-Content src-tauri/tauri.conf.json -Encoding UTF8
          Write-Host "Version actualizada a $version"

      # 3 — Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias Python
        run: pip install pyinstaller "fastapi>=0.111" "uvicorn[standard]>=0.30" PyMuPDF pytesseract Pillow openpyxl requests pydantic

      # 4 — Tesseract OCR (misma ruta que en dev: C:\Program Files\Tesseract-OCR)
      - name: Instalar Tesseract OCR
        run: choco install tesseract --yes --no-progress
        shell: cmd

      # 5 — Compilar sidecar Python → .exe
      - name: Compilar sidecar Python
        run: python -m PyInstaller server.spec --clean --noconfirm

      - name: Copiar sidecar a src-tauri/binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item "dist/juan-vivi-backend-x86_64-pc-windows-msvc.exe" "src-tauri/binaries/"

      # 6 — Rust + cache (evita recompilar todo en cada release)
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 7 — Compilar Tauri, firmar y crear release
      #     TAURI_SIGNING_PRIVATE_KEY debe estar en Settings → Secrets del repo
      - name: Build y publicar release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'JUAN-VIVI ${{ github.ref_name }}'
          releaseBody: |
            ## JUAN-VIVI ${{ github.ref_name }}

            Instalador de Windows (120 MB aprox.).

            > Las instalaciones existentes detectarán esta versión automáticamente
            > al abrir el programa y se actualizarán sin intervención manual.
          releaseDraft: false
          prerelease: false

      # 8 — Generar y subir latest.json manualmente (auto-updater Tauri v2)
      #     tauri-action no lo genera correctamente para NSIS → lo hacemos aquí
      - name: Generar y subir latest.json
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $tag     = "${{ github.ref_name }}"
          $bundle  = "src-tauri/target/release/bundle/nsis"

          # Leer firma del .nsis.zip.sig
          $sigPath = "$bundle/JUAN-VIVI_${version}_x64-setup.nsis.zip.sig"
          $sig     = (Get-Content $sigPath -Raw).Trim()

          # URL de descarga del paquete de actualización
          $url = "https://github.com/Heaven1515/juan-vivi/releases/download/${tag}/JUAN-VIVI_${version}_x64-setup.nsis.zip"

          # Construir latest.json (formato Tauri v2)
          $json = [ordered]@{
            version  = $version
            notes    = "JUAN-VIVI $tag"
            pub_date = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $sig
                url       = $url
              }
            }
          } | ConvertTo-Json -Depth 5
          $json | Set-Content "latest.json" -Encoding UTF8
          Write-Host "latest.json generado:"
          Write-Host $json

          # Subir latest.json y archivos del updater al release
          gh release upload $tag `
            "latest.json" `
            "$bundle/JUAN-VIVI_${version}_x64-setup.nsis.zip" `
            "$bundle/JUAN-VIVI_${version}_x64-setup.nsis.zip.sig" `
            --clobber
