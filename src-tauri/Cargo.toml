[package]
name = "juan-vivi"
version = "2.4.0"
edition = "2021"

[package.metadata.bundle]
identifier = "cl.notaria33.juan-vivi"
icon = ["icons/icon.ico"]

[lib]
name = "juan_vivi_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
calamine = { version = "0.26", features = ["dates"] }
rust_xlsxwriter = { version = "0", features = ["chrono"] }
reqwest = { version = "0.12", features = ["json", "multipart", "cookies"] }
pdfium-render = { version = "0.8", features = ["image", "thread_safe"] }
image = { version = "0.25", default-features = false, features = ["png"] }
once_cell = "1"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
dirs = "5"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["wingdi", "windef"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
